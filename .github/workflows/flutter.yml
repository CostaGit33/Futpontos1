name: Flutter validation and build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Analyze, test and build Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify dependency graph
        run: flutter pub deps --style=compact

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Generate Web platform for CI build
        run: flutter create --platforms=web .

      - name: Build release web
        run: flutter build web --release

      - name: Upload Flutter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: futpontos-flutter-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/web
